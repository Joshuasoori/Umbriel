  <circle cx="16" cy="16" r="6.2" fill="url(#orb)" filter="url(#glow)"/>
  <circle cx="24.5" cy="10.2" r="1.15" fill="#ffffff" filter="url(#glow)"/>
  <circle cx="16" cy="16" r="14.8" fill="none" stroke="#1b4f8a" stroke-width="0.5" opacity="0.8"/>
